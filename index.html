<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearCard — דמו חי: קלירקארד Stress Test</title>
<script>try{if(localStorage.getItem('clearcard_lang')==='en'){var d=document.documentElement;d.setAttribute('dir','ltr');d.setAttribute('lang','en');}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Premium Clean Light FinTech: soft off-white canvas, pure-white
       cards lifted with delicate shadows (no hard borders), one vibrant sky
       accent, deep-slate (never pure black) text. Stripe/Vercel inspired. ---- */
    --bg:#f8fafc;
    --bg-soft:#f1f5f9;
    --panel:#ffffff;
    --panel-2:#f1f5f9;
    --line:#eef2f7;
    --line-soft:#f1f5f9;
    --text:#0f172a;
    --text-dim:#475569;
    --text-faint:#94a3b8;
    --brand:#0ea5e9;
    --brand-2:#38bdf8;
    --brand-deep:#0284c7;
    --brand-dim:#e0f2fe;
    --safe:#16a34a;
    --safe-bg:#f0fdf4;
    --warn:#d97706;
    --warn-bg:#fffbeb;
    --danger:#dc2626;
    --danger-bg:#fef2f2;
    --radius:16px;
    --radius-sm:14px;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --shadow-card:0 4px 12px rgba(15,23,42,.04);
    --shadow-lift:0 10px 24px rgba(15,23,42,.07);
    --font-display:'Heebo', sans-serif;
    --font-body:'Heebo', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  .ico{display:inline-block;vertical-align:-3px;flex-shrink:0;}
  body{
    position:relative;
    background-color:var(--bg);
    background-image:
      radial-gradient(900px 620px at 6% -8%, rgba(14,165,233,.13), transparent 60%),
      radial-gradient(760px 560px at 100% 6%, rgba(56,189,248,.10), transparent 58%),
      radial-gradient(680px 520px at 92% 96%, rgba(22,163,74,.07), transparent 55%),
      radial-gradient(620px 480px at 4% 92%, rgba(217,119,6,.06), transparent 55%),
      linear-gradient(180deg, #fbfdff 0%, var(--bg) 40%, #f5f8fb 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    height:100dvh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  a{color:var(--brand);}
  ::selection{background:var(--brand);color:#fff;}
  :focus-visible{
    outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;
    box-shadow:0 0 0 4px rgba(14,165,233,.18);
  }

  /* The whole app is locked to one viewport-height column: header and mode
     switch keep their natural size, .grid absorbs whatever space is left
     (shrinking the chat/sidebar internally) so the page itself never needs
     to be scrolled to reach the judge panel. */
  .wrap{
    position:relative;z-index:1;max-width:1200px;width:100%;margin:0 auto;
    padding:22px 24px 14px;
    flex:1;min-height:0;
    display:flex;flex-direction:column;
  }

  /* ---------- entrance animation ---------- */
  @keyframes enterUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }
  .enter{animation:enterUp .75s var(--ease-out) both;}
  .enter-1{animation-delay:.02s;}
  .enter-2{animation-delay:.11s;}
  .enter-3{animation-delay:.20s;}
  .enter-4{animation-delay:.29s;}
  .enter-5{animation-delay:.37s;}
  .enter-6{animation-delay:.45s;}

  /* ---------- header ---------- */
  header.top{flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:10px;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand svg{flex-shrink:0;width:34px;height:34px;}
  .brand-text h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(26px, 3.2vw, 36px);
    margin:0;
    letter-spacing:-.02em;
    line-height:1.1;
    color:var(--text);
  }
  .brand-text p{margin:4px 0 0;font-size:13px;color:var(--text-dim);}


  /* ---------- mode switch ---------- */
  .mode-switch-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-bottom:16px;}
  .mode-switch{
    position:relative;display:inline-flex;background:var(--panel);
    border-radius:999px;padding:5px;gap:4px;
    box-shadow:var(--shadow-card);
    min-width:300px;
  }
  .ms-thumb{
    position:absolute;top:5px;bottom:5px;left:0;border-radius:999px;
    background:var(--brand);
    box-shadow:0 6px 16px rgba(14,165,233,.35);
    transition:left .45s var(--ease-out), width .45s var(--ease-out);
    z-index:0;
  }
  .ms-btn{
    position:relative;z-index:1;flex:1;
    appearance:none;border:none;cursor:pointer;
    padding:9px 22px;border-radius:999px;
    font-family:var(--font-body);font-size:14px;font-weight:600;
    color:var(--text-dim);background:transparent;
    transition:color .2s ease;
    white-space:nowrap;
  }
  .ms-btn.active{color:#fff;}
  .ms-btn:not(.active):hover{color:var(--text);}
  .mode-hint{margin-top:8px;font-size:12.5px;color:var(--text-dim);text-align:center;min-height:16px;}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;flex:1;min-height:0;}
  .grid > *{min-height:0;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }

  /* main-panel fills its full grid-cell height; chat-body is the only part
     that stretches/scrolls, so the outer page never has to. */
  .main-panel{height:100%;display:flex;flex-direction:column;min-height:0;}

  /* ---------- chat panel ---------- */
  .chat-head{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--line);
  }
  .chat-head .who{display:flex;align-items:center;gap:12px;}
  .chat-avatar{
    width:36px;height:36px;border-radius:12px;background:var(--brand);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;font-family:var(--font-mono);
  }
  .chat-head .name{font-weight:700;font-size:15px;color:var(--text);}
  .chat-head .sub{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--safe);}
  .status-dot.busy{background:var(--warn);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .chat-body{
    flex:1;min-height:120px;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;
    scroll-behavior:smooth;background:var(--panel);
  }
  .chat-body::-webkit-scrollbar{width:8px;}
  .chat-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .msg{max-width:78%;display:flex;flex-direction:column;gap:4px;animation:rise .38s var(--ease-out) both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
  .msg.bot{align-self:flex-start;}
  .msg.user{align-self:flex-end;}
  .msg .bubble{
    padding:13px 17px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;line-height:1.6;
  }
  /* organic, asymmetric bubbles: one corner pulled in near the "tail" edge.
     Logical properties keep the tail on the correct side under RTL. */
  .msg.bot .bubble{
    background:var(--panel-2);color:var(--text);
    border-start-start-radius:4px;
  }
  .msg.user .bubble{
    background:var(--brand);color:#fff;
    border-start-end-radius:4px;
    box-shadow:0 6px 16px rgba(14,165,233,.25);
  }
  .msg .tag{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);padding:0 4px;display:flex;align-items:center;gap:6px;}

  /* persona (customer) styling in auto mode - amber, not red: this is just
     the simulated customer talking, not an error/failure state. Red stays
     reserved for the bot's actual flagged policy failures below. */
  .msg.persona{align-self:flex-end;}
  .msg.persona .bubble{
    background:var(--warn-bg);color:#92400e;
    border-start-end-radius:4px;
  }
  .msg.persona .tag{color:var(--warn);}

  .msg.bot.flagged .bubble{
    background:var(--danger-bg);
    box-shadow:0 0 0 1.5px var(--danger), 0 10px 24px rgba(220,38,38,.14);
  }
  .flag-badge{
    display:inline-flex;align-items:center;gap:3px;
    background:var(--danger);color:#fff;
    font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em;
  }

  .typing-wrap{align-self:flex-start;}
  .typing{display:flex;gap:4px;padding:13px 17px;background:var(--panel-2);border-radius:16px;border-start-start-radius:4px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* input row - manual mode */
  .input-row{flex-shrink:0;display:flex;gap:12px;padding:14px 22px;border-top:1px solid var(--line);align-items:center;}
  .input-row input{
    flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:13px 18px;color:var(--text);font-family:var(--font-body);font-size:14.5px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-dim);outline:none;}
  .input-row input::placeholder{color:var(--text-faint);}
  .input-row input:disabled{opacity:.5;}

  .btn{
    appearance:none;border:none;cursor:pointer;border-radius:var(--radius-sm);
    padding:13px 22px;font-family:var(--font-body);font-weight:600;font-size:14px;
    background:var(--brand);color:#fff;
    box-shadow:0 4px 14px rgba(14,165,233,.3);
    transition:box-shadow .25s var(--ease-out), transform .2s var(--ease-out), filter .15s ease, opacity .2s ease;
  }
  .btn:hover{filter:brightness(1.05);transform:translateY(-2px);box-shadow:0 10px 22px rgba(14,165,233,.36);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);box-shadow:none;}
  .btn.ghost:hover{color:var(--text);border-color:var(--brand);transform:translateY(-2px);}
  .btn.danger-o{background:transparent;border:1px solid var(--danger);color:var(--danger);box-shadow:none;}
  .btn.sm{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12.5px;}
  .btn.sm:hover{transform:none;}

  /* floating circular send button (FAB) */
  .fab{
    appearance:none;border:none;cursor:pointer;flex-shrink:0;
    width:48px;height:48px;border-radius:50%;
    background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(14,165,233,.35);
    transition:box-shadow .25s var(--ease-out), transform .2s var(--ease-out), filter .15s ease, opacity .2s ease;
  }
  .fab svg{width:19px;height:19px;transform:scaleX(-1);}
  .fab:hover{filter:brightness(1.05);transform:translateY(-2px) scale(1.05);box-shadow:0 10px 22px rgba(14,165,233,.42);}
  .fab:active{transform:translateY(0) scale(.96);}
  .fab:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}

  /* auto mode control bar */
  .auto-controls{flex-shrink:0;padding:14px 22px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .progress-wrap{flex:1;min-width:160px;}
  .progress-label{font-size:13px;color:var(--text-dim);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;}
  .progress-label span:last-child{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--text);}
  .progress-bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;}
  .progress-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .45s var(--ease-out);width:0%;}

  /* ---------- sidebar ---------- */
  /* Fills the same row-height as the chat panel; scrolls internally as a
     safety net only if its own content is ever taller than the viewport
     leaves room for - the outer page itself never needs to scroll. */
  .side{height:100%;min-height:0;overflow-y:auto;padding-inline-end:2px;}
  .side .panel + .panel{margin-top:12px;}
  .side-head{padding:12px 18px 0;font-size:11px;letter-spacing:.05em;color:var(--text-faint);font-family:var(--font-mono);}
  .side-body{padding:10px 18px 14px;}

  .run-btn{width:100%;margin-top:16px;padding:14px;font-size:14.5px;}

  /* score / verdict */
  .verdict-result > *{animation:enterUp .55s var(--ease-out) both;}
  .verdict-result > *:nth-child(1){animation-delay:.04s;}
  .verdict-result > *:nth-child(2){animation-delay:.11s;}
  .verdict-result > *:nth-child(3){animation-delay:.18s;}
  .verdict-result > *:nth-child(4){animation-delay:.25s;}
  .verdict-result > *:nth-child(5){animation-delay:.32s;}
  .verdict-icon{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:8px;
  }
  .verdict-icon.pass{background:var(--safe-bg);color:var(--safe);}
  .verdict-icon.fail{background:var(--danger-bg);color:var(--danger);}
  .score-wrap{display:flex;align-items:center;gap:14px;}
  .score-ring{
    width:60px;height:60px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--ring-color,var(--brand)) calc(var(--score,0)*1%), var(--line-soft) 0);
    position:relative;
  }
  .score-ring::before{
    content:'';position:absolute;inset:5px;border-radius:50%;background:var(--panel);
  }
  .score-ring span{position:relative;font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--text);}
  .verdict-chip{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    font-size:12px;font-family:var(--font-mono);font-weight:600;margin-bottom:6px;
  }
  .verdict-chip.pass{background:var(--safe-bg);color:var(--safe);}
  .verdict-chip.fail{background:var(--danger-bg);color:var(--danger);}
  .reasoning{margin-top:10px;font-size:13px;color:var(--text-dim);line-height:1.55;}
  .quote-block{
    margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--danger-bg);
    border-inline-start:3px solid var(--danger);font-size:12.5px;color:#991b1b;font-style:normal;
  }

  /* ---------- judge results modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(15,23,42,.5);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    animation:overlayIn .2s ease both;
  }
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  .modal-card{
    position:relative;
    background:var(--panel);border-radius:var(--radius);
    box-shadow:var(--shadow-lift);
    padding:28px;max-width:420px;width:100%;
    max-height:85vh;overflow-y:auto;
    animation:modalIn .3s var(--ease-out) both;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .modal-close{
    position:absolute;top:14px;inset-inline-end:14px;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:none;cursor:pointer;color:var(--text-dim);
    transition:background .2s ease, color .2s ease;
  }
  .modal-close:hover{background:var(--line);color:var(--text);}
  .modal-title{font-size:15px;font-weight:700;color:var(--text);margin:0 0 16px;padding-inline-end:30px;}
  .modal-loading{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:20px 8px;color:var(--text-dim);font-size:13.5px;
  }

  .empty-state{font-size:13px;color:var(--text-faint);text-align:center;padding:16px 8px;}

  .persona-card{display:flex;gap:12px;align-items:flex-start;}
  .persona-avatar{
    width:40px;height:40px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(145deg,#e5484d,#a02b30);
    display:flex;align-items:center;justify-content:center;color:#fff;
    filter:saturate(.6) brightness(1.06);
    box-shadow:var(--shadow-card);
  }
  .persona-card h3{margin:0 0 3px;font-size:14.5px;color:var(--text);}
  .persona-card p{margin:0;font-size:12.5px;color:var(--text-dim);}

  .persona-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .persona-card-btn{
    display:flex;flex-direction:column;text-align:start;padding:0;
    border-radius:var(--radius-sm);overflow:hidden;
    background:var(--panel);cursor:pointer;opacity:.75;position:relative;
    box-shadow:var(--shadow-card);
    transition:transform .4s var(--ease-out), box-shadow .4s var(--ease-out), opacity .3s ease;
  }
  .persona-card-btn:hover{opacity:1;transform:translateY(-4px);box-shadow:var(--shadow-lift);}
  .pc-top{height:44px;display:flex;align-items:center;justify-content:center;color:#fff;filter:saturate(.6) brightness(1.08);transition:filter .3s ease;}
  .pc-emoji{display:flex;}
  .pc-bottom{padding:7px 10px 9px;}
  .pc-title{font-weight:700;font-size:12px;color:var(--text);margin-bottom:1px;}
  .pc-desc{font-size:10px;color:var(--text-dim);line-height:1.3;}
  .persona-card-btn.selected{
    opacity:1;
    box-shadow:0 0 0 2px var(--brand), var(--shadow-lift);
  }
  .persona-card-btn.locked{opacity:.35;cursor:not-allowed;pointer-events:none;}

  .persona-section{position:relative;}
  .persona-disabled-banner{
    display:none;align-items:center;gap:9px;
    background:var(--bg-soft);border-radius:12px;
    padding:9px 12px;margin-bottom:10px;font-size:12px;color:var(--text-dim);font-weight:600;
  }
  .persona-disabled-banner.show{display:flex;}
  .persona-fade-target{transition:opacity .3s ease, filter .3s ease;}
  .persona-fade-target.disabled{opacity:.45;pointer-events:none;filter:grayscale(.35);}


  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-family:var(--font-mono);padding:6px 11px;border-radius:999px;
    background:var(--panel-2);color:var(--text-dim);
  }
  .chip .ico{vertical-align:-2px;}

  /* ---------- mobile / tablet ---------- */
  /* Below the point where the grid stacks to one column, the strict
     viewport-lock (built for the two-column desktop layout) stops making
     sense - a phone doesn't have room for chat + persona picker + policy
     all inside one screen height. Drop it and let the page scroll normally,
     which is what people actually expect on mobile. */
  @media (max-width:900px){
    html,body{height:auto;}
    body{height:auto;overflow-y:visible;display:block;}
    .wrap{flex:none;min-height:0;display:block;padding:52px 16px 28px;}
    header.top{flex-direction:column;align-items:flex-end;gap:12px;margin-bottom:14px;}
    .mode-switch-wrap{margin-bottom:20px;}
    .mode-switch{min-width:0;width:100%;max-width:360px;}
    .grid{flex:none;min-height:0;}
    .main-panel{height:auto;}
    .chat-body{flex:none;height:58vh;min-height:280px;}
    .side{height:auto;overflow-y:visible;}
    .chat-head{flex-wrap:wrap;row-gap:10px;}
    #manual-finish{white-space:nowrap;}
    .persona-grid{gap:8px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  /* ---------- language switch ---------- */
  .lang-switch{
    position:fixed;top:16px;inset-inline-start:20px;z-index:70;
    display:inline-flex;gap:3px;padding:4px;border-radius:999px;
    background:var(--panel);box-shadow:var(--shadow-card);
  }
  .lang-switch button{
    appearance:none;border:0;cursor:pointer;background:transparent;
    font-family:var(--font-body);font-size:12.5px;font-weight:600;line-height:1;
    color:var(--text-dim);padding:6px 13px;border-radius:999px;
    transition:background .2s ease,color .2s ease;
  }
  .lang-switch button.active{background:var(--brand);color:#fff;}
  .lang-switch button:not(.active):hover{color:var(--text);}
  @media (max-width:900px){
    .lang-switch{top:12px;inset-inline-start:14px;}
    .lang-switch button{padding:5px 11px;font-size:12px;}
  }
</style>
</head>
<body>
<div class="lang-switch" role="group" aria-label="Language / שפה">
  <button id="lang-he" type="button" lang="he">עב</button>
  <button id="lang-en" type="button" lang="en">EN</button>
</div>
<div class="wrap">

  <header class="top enter enter-1">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
        <circle cx="20" cy="20" r="11" stroke="#0ea5e9" stroke-width="2"/>
        <path d="M20 9 L20 2 M20 38 L20 31 M9 20 L2 20 M38 20 L31 20" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3.5" fill="#0f172a"/>
      </svg>
      <div class="brand-text">
        <h1>ClearCard</h1>
        <p>Automated QA for AI Agents</p>
      </div>
    </div>
  </header>

  <div class="mode-switch-wrap enter enter-2">
    <div class="mode-switch" role="group" data-i18n-aria="modeAria" aria-label="בחירת מצב הפעלה">
      <div class="ms-thumb" id="ms-thumb"></div>
      <button id="tab-manual" class="ms-btn" aria-pressed="false"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-8.85 8.38A8.5 8.5 0 0 1 4 12a8.5 8.5 0 0 1 8.5-8.5A8.38 8.38 0 0 1 21 11.5Z"/></svg> <span data-i18n="tabManual">מצב ידני</span></button>
      <button id="tab-auto" class="ms-btn active" aria-pressed="true"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 11 14 9 22 21 10 13 10 13 2"/></svg> <span data-i18n="tabAuto">מצב אוטומטי</span></button>
    </div>
    <div class="mode-hint" id="mode-hint" data-i18n="hintAuto">מצב אוטומטי: תן ל-AI לבחון את הבוט</div>
  </div>

  <div class="grid">
    <!-- MAIN CHAT PANEL -->
    <div class="panel main-panel enter enter-3">
      <div class="chat-head">
        <div class="who">
          <div class="chat-avatar">CC</div>
          <div>
            <div class="name" data-i18n="chatName">קלירקארד · עוזר וירטואלי</div>
            <div class="sub"><span class="status-dot" id="status-dot"></span><span id="status-text" data-i18n="statusOnline">מחובר</span></div>
          </div>
        </div>
        <button class="btn ghost sm" id="manual-finish" type="button" disabled style="display:none;">
          <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h14l-3 4 3 4H5"/></svg> <span data-i18n="finishBtn">סיום ושיפוט</span>
        </button>
      </div>

      <div class="chat-body" id="chat-body" role="log" aria-live="polite" data-i18n-aria="chatAria" aria-label="שיחת הצ'אט">
        <div class="empty-state" style="margin:auto;" data-i18n="emptyState">בחרו פרסונה והריצו סימולציה</div>
      </div>

      <!-- manual controls -->
      <div class="input-row" id="manual-controls" style="display:none;">
        <input id="manual-input" type="text" data-i18n-ph="inputPh" placeholder="כתוב הודעה לבוט של קלירקארד…" autocomplete="off">
        <button class="fab" id="manual-send" data-i18n-aria="sendAria" aria-label="שלח">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

      <!-- auto controls -->
      <div class="auto-controls" id="auto-controls">
        <div class="progress-wrap">
          <div class="progress-label"><span id="progress-text" data-i18n="idle">ממתין</span><span id="progress-count">סבב 0 / 4</span></div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" id="auto-reset" style="display:none;" data-i18n="reset">איפוס</button>
          <button class="btn" id="auto-run" data-i18n="runSim">▶ הרץ סימולציה</button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="side">
      <!-- bot policy (always visible) -->
      <div class="panel enter enter-4">
        <div class="side-head" data-i18n="policyHead">מדיניות הבוט</div>
        <div class="side-body">
          <div class="chip-row">
            <span class="chip"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> <span data-i18n="chipVerify">אימות זהות חובה</span></span>
            <span class="chip"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="5.5" y1="5.5" x2="18.5" y2="18.5"/></svg> <span data-i18n="chipNoBreach">ללא חריגת מסגרת</span></span>
            <span class="chip"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg> Gemini AI</span>
          </div>
        </div>
      </div>

      <!-- persona picker (always visible, faded/disabled in manual mode) -->
      <div class="panel enter enter-5">
        <div class="side-head" data-i18n="personaHead">פרסונה</div>
        <div class="side-body persona-section">
          <div class="persona-disabled-banner" id="persona-disabled-banner"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> <span data-i18n="personaDisabled">זמין במצב אוטומטי בלבד</span></div>
          <div class="persona-fade-target" id="persona-fade-target">
            <div class="persona-grid" id="persona-picker"></div>
            <div class="persona-card" id="persona-detail" style="margin-top:10px;"></div>
            <div class="chip-row" id="persona-chips"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- judge results popup - shown on demand after an auto simulation
     finishes, or when "סיום ושיפוט" is clicked in manual mode -->
<div class="modal-overlay" id="verdict-modal" role="dialog" aria-modal="true" data-i18n-aria="verdictAria" aria-label="תוצאות השיפוט" style="display:none;">
  <div class="modal-card">
    <button class="modal-close" id="verdict-modal-close" type="button" data-i18n-aria="closeAria" aria-label="סגור">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
    </button>
    <div id="verdict-modal-body"></div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
